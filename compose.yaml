# Every build and test runs in Docker as the host user, so generated files stay yours.
# Caches live in `.cache/` and build output in `target/`, both ignored by git.
# Use the Makefile (`make test`, `make lint`…), which passes HOST_UID and HOST_GID.
x-host-user: &host-user
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - .:/workspace
  environment:
    HOME: /workspace/.cache/home
    CARGO_HOME: /workspace/.cache/cargo
    CARGO_TARGET_DIR: /workspace/target
    CARGO_TERM_COLOR: never
    npm_config_cache: /workspace/.cache/npm
    npm_config_update_notifier: "false"

services:
  core:
    <<: *host-user
    build:
      context: .
      dockerfile: docker/core.Dockerfile

  ui:
    <<: *host-user
    working_dir: /workspace/apps/desktop
    build:
      context: .
      dockerfile: docker/ui.Dockerfile

  windows:
    <<: *host-user
    working_dir: /workspace/apps/desktop
    build:
      context: .
      dockerfile: docker/windows.Dockerfile

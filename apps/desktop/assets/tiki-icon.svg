<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Tiki's face as in the app: a dark visor with two glowing amber eyes, on a dark tile.
       The eyes are a little bigger than in the notch so the face reads at tray size. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d23"/>
      <stop offset="1" stop-color="#0a0a0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6c768" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#f6c768" stop-opacity="0"/>
    </radialGradient>
    <filter id="eye-glow" x="-60%" y="-40%" width="220%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="212" fill="url(#tile)"/>
  <ellipse cx="512" cy="560" rx="420" ry="250" fill="url(#glow)"/>
  <rect x="132" y="322" width="760" height="380" rx="190" fill="#050506" stroke="#ffffff" stroke-opacity="0.09" stroke-width="10"/>
  <g fill="#f6c768" filter="url(#eye-glow)">
    <rect x="352" y="420" width="96" height="184" rx="48"/>
    <rect x="576" y="420" width="96" height="184" rx="48"/>
  </g>
</svg>

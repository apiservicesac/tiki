name: Feature request
description: An idea to make Tiki more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How Tiki could help
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today

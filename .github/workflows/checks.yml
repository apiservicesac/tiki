name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the Docker images
        run: docker compose build core ui
      - name: Install interface dependencies
        run: make ui-install
      - name: Lint
        run: make lint
      - name: Test
        run: make test

[package]
name = "tiki-recording"
description = "Recording and local transcription of Tiki's sessions: audio sources, mixing, media writers and Whisper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Local transcription with whisper.cpp; it builds C++ with cmake, so tests use a fake.
whisper = ["dep:whisper-rs"]

[dependencies]
tiki-core.workspace = true
thiserror.workspace = true
hound = "3.5.1"
ogg = "0.9.2"
opus = "0.4.0"
# Only the blocking client: the shell's build adds TLS to the same crate.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking"] }
sha2 = "0.11.1"
whisper-rs = { version = "0.16.0", optional = true }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26.0"
windows-capture = "2.0.1"

[lints]
workspace = true
